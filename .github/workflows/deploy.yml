name: Deploy to GitHub Pages

# Builds the static site and publishes it to the gh-pages branch.
# In Settings → Pages, the source should be "Deploy from a branch: gh-pages / (root)".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build static site
        run: npx next build
        env:
          # Site is served from https://aahilali88.github.io/ALI_Portfolio.
          # Set to "" if you attach a custom domain (e.g. alfredpone.com).
          NEXT_PUBLIC_BASE_PATH: /ALI_Portfolio
          NEXT_PUBLIC_SITE_URL: https://aahilali88.github.io/ALI_Portfolio
          NEXT_TELEMETRY_DISABLED: 1
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
          commit_message: "Deploy site"
